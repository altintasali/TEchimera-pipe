# =============================================================================
# Custom MultiQC configuration, passed to every multiqc run via `-c`.
#
# The key setting is extra_fn_clean_exts: TrimGalore! names its trimmed/fastqc
# files {sample}_val_{1,2}_... / {sample}_trimmed_... (see trimming.smk), and
# without cleaning those suffixes MultiQC would derive FastQC sample names
# like "control_rep1_val_1" -- which no longer matches the "control_rep1" rows
# from STAR/RSeQC, so the General Stats table would gain extra, mostly-empty
# rows per sample. Trimming the suffixes makes every module's rows merge into
# one clean row per sample.
# =============================================================================
title: "TEchimera-pipe"
comment: >-
  Auto-generated by the TEchimera-pipe Snakemake workflow
  (STAR alignment, RSeQC strandedness, chimeric gene-TE junction screen).

extra_fn_clean_exts:
  - "_val_1"
  - "_val_2"
  - "_trimmed"

# Order report sections by the analysis flow: raw QC -> trimming -> alignment
# -> strandedness -> chimera sample-QC -> versions. FastQC appears twice (raw
# input and, when trimming is enabled, the TrimGalore!-run reports),
# disambiguated by path_filters on the output directories. The chimera QC
# custom-content sections (ids chimera_sample_qc_pca / chimera_sample_qc_heatmap,
# emitted by the sample_qc rule) sit inside their own parent section. The
# resource-usage summary (custom content emitted by the benchmark_summary rule,
# qc.smk) closes the report.
module_order:
  - fastqc:
      name: "FastQC (raw input)"
      path_filters:
        - "**/fastqc/raw/**"
  - cutadapt
  - fastqc:
      name: "FastQC (trimmed)"
      path_filters:
        - "**/trimming/**"
  - star
  - rseqc
  - custom_content

# Order of the custom-content sections (the chimera sample-QC PCA + distance
# views and the benchmark/resource summary) within the custom_content module;
# without this their order is arbitrary. Section ids come from the `_mqc.json`
# documents emitted by the sample_qc and benchmark_summary rules.
custom_content:
  order:
    - chimera_sample_qc_pca
    - chimera_sample_qc_heatmap
    - resource_usage
